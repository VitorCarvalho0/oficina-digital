<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Checklist Digital - Oficina Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Container Principal -->
    <div class="w-full max-w-md flex flex-col items-center">
        
        <!-- Logo / Cabeçalho -->
        <div class="bg-slate-900 text-white p-3 rounded-xl shadow-md mb-4 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </div>
        
        <h1 class="text-xl font-bold text-slate-800">Oficina Digital</h1>
        <p class="text-xs text-slate-500 mb-6">Sistema de checklist e gestão</p>

        <!-- Abas de Navegação -->
        <div class="bg-slate-100 p-1 rounded-lg w-full max-w-sm flex mb-6 shadow-sm border border-slate-200">
            <a href="{% url 'fazer_login' %}" class="flex-1 text-center py-1.5 text-xs font-semibold rounded-md bg-white text-slate-900 shadow-sm">Entrar</a>
            <a href="{% url 'criar_conta' %}" class="flex-1 text-center py-1.5 text-xs font-medium text-slate-500 hover:text-slate-900 transition">Criar Conta</a>
        </div>

        <!-- Card do Formulário -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 w-full">
            <h2 class="text-base font-bold text-slate-800 mb-1">Login</h2>
            <p class="text-xs text-slate-500 mb-5">Entre com suas credenciais</p>

            <form method="POST" class="space-y-4">
                {% csrf_token %} <!-- {% csrf_token %} colocado corretamente aqui dentro -->
                
                {% for field in form %}
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">
                            {% if field.name == 'username' %}Email / Usuário{% else %}Senha{% endif %}
                        </label>
                        <input type="{% if 'password' in field.name.lower %}password{% else %}text{% endif %}" 
                               name="{{ field.html_name }}" 
                               id="{{ field.id_for_label }}"
                               class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-slate-900 bg-slate-50/50">
                        
                        {% if field.errors %}
                            <span class="text-red-500 text-[10px] mt-0.5 block">{{ field.errors.0 }}</span>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 rounded-lg text-xs transition duration-200 shadow-sm mt-2">
                    Entrar
                </button>
            </form>
        </div>

    </div>

</body>
</html>
